name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend-gh-pages/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Mengatur izin token GITHUB_TOKEN untuk deployment ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi hanya satu deployment bersamaan untuk mencegah konflik rilis
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts dari frontend-gh-pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Arahkan ke folder static frontend
          path: './frontend-gh-pages'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
