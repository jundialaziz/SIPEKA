; PlatformIO Project Configuration File
; Project: IoT Fire Early Warning System (ESP32)
; Framework: Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
upload_speed = 921600

; Library Dependencies
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; Build Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3 ; Info level
